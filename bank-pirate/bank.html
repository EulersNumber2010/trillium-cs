<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f2f7; --surface:#ffffff; --surface2:#e9e9ef; --ink:#000000; --ink2:#5d5d64; --line:#c2c2c7;
  --fill:#000000; --onfill:#ffffff; --risk:#7a1f0d; --tray:#1c1c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --ink:#ffffff; --ink2:#a6a6ae; --line:#4a4a4d;
    --fill:#ffffff; --onfill:#000000; --risk:#f08f7a; --tray:#1c1c1c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --ink:#ffffff; --ink2:#a6a6ae; --line:#4a4a4d;
  --fill:#ffffff; --onfill:#000000; --risk:#f08f7a; --tray:#1c1c1c;
}
body{margin:0;background:var(--bg);color:var(--ink)}
#bank-app{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#bank-app *,#bank-app *::before,#bank-app *::after{box-sizing:border-box}
#bank-app button{font:inherit;color:inherit;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#bank-app button:disabled{cursor:default}
#bank-app input{font:inherit;color:inherit;margin:0}
#bank-app h1,#bank-app h2,#bank-app p{margin:0}
#bank-app :focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#bank-app .big{font-weight:800;font-stretch:condensed;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#bank-app .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink2)}
#bank-app .sub{font-size:13px;color:var(--ink2)}
#bank-app .row{display:flex;align-items:center;gap:8px}
#bank-app .between{justify-content:space-between}
#bank-app .grow{flex:1 1 0;min-width:0}
#bank-app .nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bank-app .card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
#bank-app svg.die{flex:none;display:block}

/* buttons */
#bank-app .ob{min-height:44px;min-width:44px;padding:0 12px;font-size:16px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
#bank-app .ob.filled{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
#bank-app .ob.danger{color:var(--risk)}
#bank-app .ob.x{font-size:22px;font-weight:600;padding:0}
#bank-app .ob:active:not(:disabled),#bank-app .sb:active:not(:disabled){opacity:.6}
#bank-app .ob:disabled,#bank-app .pb:disabled,#bank-app .sb:disabled{opacity:.4}
#bank-app .pb{width:100%;min-height:60px;padding:0 14px;font-size:26px;font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:1px;background:var(--fill);color:var(--onfill);border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px}
#bank-app .pb:active:not(:disabled){opacity:.7}
#bank-app .sb{width:100%;min-height:52px;padding:0 14px;font-size:17px;font-weight:700;background:var(--surface);border:2px solid var(--ink);border-radius:12px}
#bank-app .tb{width:100%;min-height:48px;background:none;border:0;font-size:16px;font-weight:700;color:var(--ink2);border-radius:10px}
#bank-app .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:transparent}
#bank-app .seg button{flex:1 1 0;min-width:0;min-height:44px;padding:0 6px;font-size:15px;font-weight:700;background:transparent;border:0;border-left:1px solid var(--line);white-space:nowrap}
#bank-app .seg button:first-child{border-left:0}
#bank-app .seg button[aria-pressed="true"]{background:var(--fill);color:var(--onfill)}
#bank-app .seg button:focus-visible{outline-offset:-4px}
#bank-app .seg button[aria-pressed="true"]:focus-visible{outline-color:var(--onfill)}
#bank-app .stepper{display:flex;align-items:center;gap:6px;flex:none}
#bank-app .stepper .val{min-width:44px;text-align:center;font-size:28px}
#bank-app .stepper .ob{width:44px;padding:0;font-size:22px}
#bank-app .switch{flex:none;width:60px;height:44px;padding:6px 4px;background:none;border:0;border-radius:22px}
#bank-app .switch span{display:block;width:52px;height:32px;border-radius:16px;background:var(--surface2);border:2px solid var(--ink2);position:relative}
#bank-app .switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink2);transition:transform .12s}
#bank-app .switch[aria-checked="true"] span{background:var(--fill);border-color:var(--fill)}
#bank-app .switch[aria-checked="true"] span::after{background:var(--onfill);transform:translateX(20px)}
#bank-app .field{width:100%;min-width:0;min-height:48px;padding:0 12px;font-size:17px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:11px}
#bank-app .field::placeholder{color:var(--ink2);opacity:.75;font-weight:500}

/* setup + end */
#bank-app .screen{max-width:720px;margin:0 auto;padding:8px 16px 28px;display:flex;flex-direction:column;gap:22px}
#bank-app .title{font-size:64px;line-height:1;font-weight:900;font-stretch:condensed;text-transform:uppercase;letter-spacing:-.01em}
#bank-app .sec{display:flex;flex-direction:column;gap:10px}
#bank-app .namerow{display:flex;align-items:center;gap:8px}
#bank-app .namerow .num{width:22px;text-align:right;font-size:16px;color:var(--ink2);flex:none}
#bank-app .flow{display:flex;flex-wrap:wrap;gap:6px}
#bank-app .recent{min-height:44px;padding:0 12px;font-size:14px;font-weight:600;background:none;border:1px dashed var(--ink2);border-radius:22px}
#bank-app .disc{padding:0 14px}
#bank-app .disc>button{width:100%;min-height:48px;background:none;border:0;padding:0;display:flex;align-items:center;justify-content:space-between}
#bank-app .rrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
#bank-app .rrow:first-child{border-top:0}
#bank-app .rrow .t{font-size:15px;font-weight:700}
#bank-app .winner{font-size:80px;line-height:.95;font-weight:900;font-stretch:condensed;text-transform:uppercase;overflow-wrap:anywhere}
#bank-app .srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
#bank-app .srow.first{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
#bank-app .srow.sm{min-height:44px;padding:0 12px;border-radius:10px}
#bank-app .srow.lost{background:none;border-style:dashed;border-color:var(--ink2);color:var(--ink2)}

/* game: three bands */
#bank-app .game{height:100vh;height:100dvh;min-height:560px;max-width:720px;margin:0 auto;padding:6px 16px 8px;display:flex;flex-direction:column;gap:10px}
#bank-app .game.virtual{min-height:650px}
#bank-app .top{display:flex;align-items:center;gap:8px;flex:none}
#bank-app .top .mid{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bank-app .top .rt{font-size:22px;text-transform:uppercase}
#bank-app .top .of{font-size:13px;font-weight:600;color:var(--ink2)}
#bank-app .pot{flex:none;padding:8px 14px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
#bank-app .pot.risk{border:2.5px solid var(--ink);padding:6.5px 12.5px 8.5px}
#bank-app .dots{display:inline-flex;gap:4px}
#bank-app .dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
#bank-app .dots i.on{background:var(--ink)}
#bank-app .badge{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--onfill)}
#bank-app .rollerbtn{min-height:44px;max-width:55%;padding:0 10px;font-size:14px;font-weight:600;background:none;border:1px dashed var(--ink2);border-radius:9px;display:inline-flex;align-items:center;gap:6px;min-width:0}
#bank-app .potnum{font-size:128px;line-height:1;font-weight:900;font-stretch:condensed;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap;overflow:hidden;min-height:100px;display:flex;align-items:center;justify-content:center}
#bank-app .potnum.m{font-size:100px;min-height:76px}
#bank-app .potnum.s{font-size:80px;min-height:60px}
#bank-app .potnum.bump{animation:bank-bump .25s ease-out}
@keyframes bank-bump{from{transform:scale(1.08)}to{transform:scale(1)}}
#bank-app .bkfloat{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:34px;font-variant-numeric:tabular-nums;color:var(--bkfx,#1f9d55);text-shadow:0 2px 0 rgba(0,0,0,.18);animation:bank-float 1.1s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
#bank-app .bkfloat.big{font-size:54px}
@keyframes bank-float{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
#bank-app.bkshake{overflow-x:clip}
#bank-app.bkshake>#bank-screen{animation:bank-shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes bank-shake{10%,90%{transform:translate(calc(var(--shk,1)*-3px),0)}20%,80%{transform:translate(calc(var(--shk,1)*6px),calc(var(--shk,1)*-2px))}30%,50%,70%{transform:translate(calc(var(--shk,1)*-10px),calc(var(--shk,1)*2px))}40%,60%{transform:translate(calc(var(--shk,1)*10px),0)}}
#bank-app .bkflash{position:fixed;inset:0;z-index:55;pointer-events:none;animation:bank-flash .6s ease-out forwards}
@keyframes bank-flash{from{opacity:.45}to{opacity:0}}
#bank-app .bkpop{animation:bank-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bank-pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
#bank-app .potnum.heat{overflow:visible}
#bank-app .potnum.heat span{display:inline-block;background:linear-gradient(180deg,#ffe066 0%,#ff9f1c 45%,#ff3d3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,140,0,.55));animation:bank-wob 1.6s ease-in-out infinite}
#bank-app .potnum.h2 span{filter:drop-shadow(0 0 10px rgba(255,110,0,.75)) drop-shadow(0 -4px 8px rgba(255,60,0,.45));animation:bank-wob 1.1s ease-in-out infinite,bank-flick .22s steps(2) infinite}
#bank-app .potnum.h3 span{background:linear-gradient(180deg,#fff3a0 0%,#ff7b00 40%,#ff1e56 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(255,80,0,.9)) drop-shadow(0 -6px 12px rgba(255,30,60,.6));animation:bank-wob2 .7s ease-in-out infinite,bank-flick .16s steps(2) infinite}
#bank-app .potnum.h4 span{background:linear-gradient(180deg,#ffffff 0%,#7df9ff 30%,#b06bff 65%,#ff2e88 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(160,90,255,.95)) drop-shadow(0 -8px 16px rgba(255,46,136,.7));animation:bank-wob2 .45s ease-in-out infinite,bank-flick .11s steps(2) infinite}
@keyframes bank-wob{0%,100%{transform:rotate(-1deg) scale(1)}50%{transform:rotate(1deg) scale(1.02)}}
@keyframes bank-wob2{0%,100%{transform:rotate(-2.2deg) scale(1) translateY(0)}25%{transform:rotate(1.4deg) scale(1.04) translateY(-2px)}50%{transform:rotate(2.2deg) scale(1.01) translateY(1px)}75%{transform:rotate(-1.2deg) scale(1.05) translateY(-1px)}}
@keyframes bank-flick{0%{opacity:1}100%{opacity:.9}}
#bank-app .potnum.bkslam{animation:bank-slam var(--slamd,.5s) cubic-bezier(.2,1.7,.3,1)}
@keyframes bank-slam{0%{transform:scale(var(--slam,1.3)) rotate(-4deg)}35%{transform:scale(calc(var(--slam,1.3) * .92)) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
#bank-app .bkfloat.huge{font-size:84px}
#bank-app .bkconf{position:fixed;top:0;width:10px;height:15px;border-radius:2px;z-index:70;pointer-events:none}
#bank-app .potfoot{font-size:13px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
#bank-app .potfoot .rk{color:var(--ink);font-weight:700}
#bank-app .chips{flex:1 1 0;min-height:60px;overflow-y:auto;overscroll-behavior:contain}
#bank-app .chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:3px}
#bank-app .chip{min-height:66px;padding:8px 10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
#bank-app .compact .chip{min-height:50px;padding:4px 10px;gap:0}
#bank-app .chip.leader{border:2.5px solid var(--ink);padding:6.5px 8.5px}
#bank-app .compact .chip.leader{padding:2.5px 8.5px}
#bank-app .chip.banked{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
#bank-app .chip.banked:focus-visible{outline-offset:3px}
#bank-app .chip:disabled{opacity:.55}
#bank-app .chip:active:not(:disabled){transform:scale(.98)}
#bank-app .chip .l1{display:flex;align-items:baseline;gap:6px;min-width:0}
#bank-app .chip .rank{width:26px;flex:none;font-size:13px;opacity:.75}
#bank-app .chip .nm{flex:1 1 0;min-width:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:5px}
#bank-app .chip .sc{font-size:26px;line-height:1}
#bank-app .compact .chip .sc{font-size:22px}
#bank-app .chip .l2{padding-left:32px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#bank-app .chip .dim{color:var(--ink2)}
#bank-app .chip .bk{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:1px 5px;border-radius:5px;background:var(--onfill);color:var(--fill);margin-right:4px}
#bank-app .pad{flex:none;display:flex;flex-direction:column;gap:8px;min-width:0}
#bank-app .status{flex:1 1 0;min-width:0;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bank-app .keys{display:flex;flex-direction:column;gap:8px}
#bank-app .krow{display:flex;gap:7px}
#bank-app .key{flex:1 1 0;min-width:0;min-height:54px;padding:0 4px;font-size:28px;font-weight:800;font-stretch:condensed;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
#bank-app .key.wide{min-height:50px;font-size:26px}
#bank-app .key.strong{border:2.5px solid var(--ink)}
#bank-app .key.filled{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
#bank-app .key.alt{background:var(--surface2);font-size:22px;text-transform:uppercase}
#bank-app .key .kl{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;font-stretch:normal;color:var(--ink2)}
#bank-app .key.filled .kl{color:var(--onfill)}
#bank-app .key:active:not(:disabled){transform:scale(.96);opacity:.75}
#bank-app .key:disabled{opacity:.5}
#bank-app .hint{display:none;font-size:12px;color:var(--ink2);text-align:center}
#bank-app .tray{position:relative;height:220px;border-radius:16px;background:var(--tray);border:1px solid var(--line);overflow:hidden;cursor:pointer}
#bank-app .dw{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-54px 0 0 -42px;perspective:520px;will-change:transform}
#bank-app .cube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#bank-app .face{position:absolute;inset:0;border-radius:13px;background:#f7f7f7;box-shadow:inset 0 0 0 2px #d0d0d0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#bank-app .face svg{width:100%;height:100%;display:block}
#bank-app .pill{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:4px 12px;border-radius:14px;background:rgba(0,0,0,.55);color:#f2f2f2;font-size:15px;font-weight:700;white-space:nowrap}
#bank-app .cap{display:flex;justify-content:space-between;gap:8px;padding:0 2px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink2);white-space:nowrap}

/* sheets */
#bank-app .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#bank-app .sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px;outline:none;box-shadow:0 0 0 1px var(--line)}
#bank-app .sheet.wide{max-width:860px}
#bank-app .shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px}
#bank-app .shead h2{font-size:24px;font-weight:800;font-stretch:condensed;text-transform:uppercase;letter-spacing:.5px;min-width:0;overflow-wrap:anywhere}
#bank-app .mitem{width:100%;min-height:54px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px}
#bank-app .mitem b{font-size:17px}
#bank-app .mitem.danger b{color:var(--risk)}
#bank-app .mitem span{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bank-app .prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
#bank-app .prow:first-child{border-top:0}
#bank-app .prow .pn{flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:3px}
#bank-app .prow .pn .field{min-height:44px;font-size:16px;font-weight:700}
#bank-app .prow .pb2{display:flex;gap:6px;flex:none}
#bank-app .lrow{width:100%;min-height:48px;padding:0 8px;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:10px}
#bank-app .lrow.sel{background:var(--surface2)}
#bank-app .lrow .rn{width:36px;flex:none;font-size:15px;color:var(--ink2)}
#bank-app .lrow .ds{flex:1 1 0;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bank-app .lrow .pv{font-size:22px}
#bank-app .lwrap{border-top:1px solid var(--line)}
#bank-app .lwrap:first-child{border-top:0}
#bank-app .editor{display:flex;flex-direction:column;gap:8px;padding:10px 4px}
#bank-app .editor .key{min-height:44px;font-size:22px}
#bank-app .tablewrap{overflow-x:auto;padding:10px 12px}
#bank-app table.hist{border-collapse:collapse;min-width:100%}
#bank-app table.hist th,#bank-app table.hist td{text-align:right;padding:5px 7px;white-space:nowrap;vertical-align:top}
#bank-app table.hist th:first-child,#bank-app table.hist td:first-child{text-align:left;padding-left:0}
#bank-app table.hist thead th{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);max-width:110px;overflow:hidden;text-overflow:ellipsis}
#bank-app table.hist tbody tr,#bank-app table.hist tfoot tr{border-top:1px solid var(--line)}
#bank-app table.hist .a{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
#bank-app table.hist .n{color:var(--ink2)}
#bank-app table.hist .rt{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
#bank-app .reh{font-size:56px;line-height:1;font-weight:900;font-stretch:condensed;text-transform:uppercase;text-align:center}
#bank-app .reh.bust{color:var(--risk)}
#bank-app .center{text-align:center}

@media (max-width:520px){
  #bank-app .chip .l2{padding-left:0}
}
@media (max-width:420px){
  #bank-app .winner{font-size:60px}
  #bank-app .potnum{font-size:112px}
}
@media (min-width:900px){
  #bank-app .game,#bank-app .game.virtual{max-width:1400px;min-height:500px;padding:8px 20px 12px;display:grid;
    grid-template-columns:minmax(0,1fr) minmax(380px,36%);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"top top" "pot pad" "chips pad";gap:10px 18px}
  #bank-app .top{grid-area:top}
  #bank-app .pot{grid-area:pot}
  #bank-app .chips{grid-area:chips}
  #bank-app .pad{grid-area:pad;min-height:0}

      var old = sheetEl.querySelector('.sheet'), oldKind = old ? old.dataset.kind : '', st = old ? old.scrollTop : 0;
      sheetEl.innerHTML = sheetHTML();
      var sh = sheetEl.querySelector('.sheet'), kind = sh ? sh.dataset.kind : '';
      if (sh) screenEl.setAttribute('inert', ''); else screenEl.removeAttribute('inert');
      if (sh && kind === oldKind) sh.scrollTop = st;
      if (sh && kind !== oldKind) { sh.focus({ preventScroll: true }); fk = null; }
    }
    if (fk) { var t = app.querySelector(fk); if (t && t !== document.activeElement && !t.disabled) { try { t.focus({ preventScroll: true }); } catch (e) {} } }
  }

  // ---------- actions ----------
  function rulesTarget() { return S.screen === 'setup' || !S.game ? S.setup.rules : C.Rules(S.game.rules); }
  function rulesCommit(r) { if (S.screen === 'setup' || !S.game) S.setup.rules = r; else setRules(r); }
  function closeSheet() { if (S.sheet) { S.sheet = null; S.sel = null; S.removing = null; } else if (S.pending) S.pending = null; }
  function addFromSheet() {
    if (!S.newName.trim()) { var n = document.getElementById('new-name'); if (n) n.focus(); return false; }
    var sc = parseInt(S.newScore, 10);
    addPlayer(S.newName, isNaN(sc) ? lowestScore() : sc);
    S.newName = ''; S.newScore = String(lowestScore());
    return true;
  }
  var A = {
    // setup
    addName: function () { S.setup.names.push(''); render(); focusName(S.setup.names.length - 1); return false; },
    rmName: function (i) { if (S.setup.names.length > 1) S.setup.names.splice(+i, 1); },
    recent: function (n) { var i = -1; S.setup.names.forEach(function (x, k) { if (i < 0 && !x.trim()) i = k; }); if (i >= 0) S.setup.names[i] = n; else S.setup.names.push(n); },
    rounds: function (n) { S.setup.rounds = +n; },
    roundsStep: function (dl) { S.setup.rounds = Math.max(1, Math.min(99, S.setup.rounds + +dl)); },
    virt: function (v) { S.setup.virtualDice = v === '1'; },
    toggleRules: function () { S.showRules = !S.showRules; },
    safeStep: function (dl) { var r = rulesTarget(); r.safeRolls = Math.max(0, Math.min(6, r.safeRolls + +dl)); rulesCommit(r); },
    tog7: function () { var r = rulesTarget(); r.sevenPays70 = !r.sevenPays70; rulesCommit(r); },
    togDbl: function () { var r = rulesTarget(); r.safeDoublesDouble = !r.safeDoublesDouble; rulesCommit(r); },
    theme: function (t) { S.prefs.theme = t; savePrefs(); },
    start: function () { startGame(); },
    // game
    open: function (k) {
      S.sel = null; S.removing = null;
      if (k === 'players') { S.newName = ''; S.newScore = String(lowestScore()); }
      S.sheet = { kind: k };
    },
    close: function () { closeSheet(); },
    pass: function () { passDice(); },
    chip: function (pid) { if (isBanked(pid)) S.sheet = { kind: 'unbank', pid: pid }; else bank(pid); },
    undo: function () { undo(); },
    redo: function () { redo(); },
    key: function (n) { enterRoll(+n, false); },
    dbl: function () { enterRoll(0, true); },
    vroll: function () { virtualRoll(); return false; },
    final: function () { finish(); },
    // sheets
    toggleSound: function () { S.prefs.sound = !S.prefs.sound; savePrefs(); if (S.prefs.sound) FX.play('bank'); },
    cycleTheme: function () { var o = ['system', 'light', 'dark']; S.prefs.theme = o[(o.indexOf(S.prefs.theme) + 1) % 3]; savePrefs(); },
    doEnd: function () { finish(); },
    doNew: function () { toSetup(); },
    doUnbank: function () { var pid = S.sheet.pid; S.sheet = null; unbank(pid); },
    gRoundsStep: function (dl) { setRounds(S.game.rounds + +dl); },
    gVirt: function (v) { setVirtual(v === '1'); },
    up: function (pid) { move(pid, -1); },
    down: function (pid) { move(pid, 1); },
    sit: function (pid) { act(S.d.active.has(pid) ? E.leave(pid) : E.rejoin(pid)); },
    rmAsk: function (pid) { S.removing = pid; },
    rmCancel: function () { S.removing = null; },
    rmDo: function (pid) { S.removing = null; removePlayer(pid); },
    addPlayer: function () { return addFromSheet(); },
    sel: function (i) { S.sel = S.sel === +i ? null : +i; },
    chg: function (n) { replaceRoll(S.sel, +n, false); S.sel = null; S.sheet = null; },
    chgDbl: function () { replaceRoll(S.sel, 0, true); S.sel = null; S.sheet = null; },
    ins: function (pid) { insertBank(S.sel, pid); S.sel = null; S.sheet = null; },
    del: function () { deleteEvent(S.sel); S.sel = null; S.sheet = null; },
    next: function () { S.pending = null; if (S.d.over) finish(); },
    undoRound: function () { S.pending = null; undo(); },
    // end
    again: function () { newSetup(S.game); S.game = null; startGame(); },
    backSetup: function () { toSetup(); }
  };
  function focusName(i) { var el = app.querySelector('[data-in="name"][data-arg="' + i + '"]'); if (el) el.focus(); }

  app.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || !app.contains(el)) {
      if (ev.target.dataset && ev.target.dataset.overlay) { closeSheet(); render(); }
      return;
    }
    if (el.disabled) return;
    var fn = A[el.dataset.act]; if (!fn) return;
    if (fn(el.dataset.arg) !== false) render();
  });
  app.addEventListener('input', function (ev) {
    var el = ev.target, k = el.dataset ? el.dataset.in : null; if (!k) return;
    if (k === 'name') {
      S.setup.names[+el.dataset.arg] = el.value;
      var st = document.getElementById('start'); if (st) st.disabled = !setupNames().length;
    } else if (k === 'rename') { rename(el.dataset.arg, el.value); render('screen'); }
    else if (k === 'newName') S.newName = el.value;
    else if (k === 'newScore') { el.value = el.value.replace(/[^0-9-]/g, ''); S.newScore = el.value; }
  });
  var pendingOne = 0;
  document.addEventListener('keydown', function (ev) {
    var t = ev.target, inField = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (ev.key === 'Escape' && (S.sheet || S.pending)) { closeSheet(); render(); ev.preventDefault(); return; }
    if (ev.key === 'Enter' && inField && t.dataset && t.dataset.in) {
      if (t.dataset.in === 'name') {
        var i = +t.dataset.arg;
        if (i === S.setup.names.length - 1) { if (!t.value.trim()) { if (setupNames().length) { startGame(); render(); } return; } S.setup.names.push(''); render(); }
        focusName(i + 1);
      } else if (t.dataset.in === 'newName' || t.dataset.in === 'newScore') { if (addFromSheet()) { render(); var n = document.getElementById('new-name'); if (n) n.focus(); } }
      else t.blur();
      ev.preventDefault(); return;
    }
    if (inField || ev.ctrlKey && ev.key !== 'z' || ev.metaKey && ev.key !== 'z' || ev.altKey) return;
    if (S.screen !== 'game' || !S.game || S.sheet || S.pending) return;
    var k = ev.key.toLowerCase(), done = true;
    if (k === 'u' || k === 'z') { undo(); }
    else if (S.d.over) done = false;
    else if (S.game.virtualDice) { if (k === 'r') { virtualRoll(); ev.preventDefault(); return; } done = false; }
    else if (pendingOne && Date.now() - pendingOne < 1200 && (k === '0' || k === '1' || k === '2')) { pendingOne = 0; enterRoll(10 + +k, false); }
    else if (k === '1') { pendingOne = Date.now(); ev.preventDefault(); return; }
    else if (k >= '2' && k <= '9' && k.length === 1) { pendingOne = 0; enterRoll(+k, false); }
    else if (k === 'd') { var dk = document.getElementById('key-doubles'); if (dk && !dk.disabled) enterRoll(0, true); }
    else done = false;
    if (done) { ev.preventDefault(); render(); }
  });
  window.addEventListener('resize', fitPot);
  render();
})();
</script>
</body>
</html>
